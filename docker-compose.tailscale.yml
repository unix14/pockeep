# Optional: put pockeep on your tailnet with its own MagicDNS name and HTTPS,
# using a Tailscale sidecar container. No ports are opened on the LXC.
#
#   1. In the Tailscale admin console: enable MagicDNS and HTTPS certificates,
#      then create an auth key (Settings -> Keys). Put it in .env as TS_AUTHKEY.
#   2. docker compose -f docker-compose.yml -f docker-compose.tailscale.yml up -d --build
#   3. Open https://pockeep.<your-tailnet>.ts.net
#
# TS_USERSPACE=true means the sidecar needs no /dev/net/tun, which keeps the
# Proxmox LXC configuration simple. Requires Docker Compose v2.24+ (for !reset).

services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: pockeep-tailscale
    hostname: ${TS_HOSTNAME:-pockeep}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY in .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro

  pockeep:
    # share the sidecar's network namespace; Tailscale proxies HTTPS to 127.0.0.1:3000
    network_mode: service:tailscale
    ports: !reset []
    depends_on:
      - tailscale
    environment:
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
