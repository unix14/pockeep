# PocKeep: privacy-first, self-hosted dashboard for WhatsApp notes-to-self.
#
#   cp .env.example .env      # set ADMIN_PASSWORD and SEED_USER_PASSWORD
#   mkdir -p data && sudo chown 1000:1000 data
#   docker compose up -d --build
#
# Reach it at http://<lxc-ip>:3000 (or your Tailscale IP / MagicDNS name).
# To publish it only on your tailnet with HTTPS, also use docker-compose.tailscale.yml (see README).

name: pockeep

services:
  pockeep:
    build: .
    image: pockeep:latest
    container_name: pockeep
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    ports:
      # POCKEEP_BIND=100.x.y.z (your LXC's Tailscale IP) exposes it only on the tailnet
      - "${POCKEEP_BIND:-0.0.0.0}:${POCKEEP_PORT:-3000}:3000"
    volumes:
      # SQLite database (pockeep.db + WAL files) and stored export files (exports/<userId>/)
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
